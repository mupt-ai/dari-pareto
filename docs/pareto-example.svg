<svg aria-label="Cost × Performance" height="290" role="img" style="display:block;width:100%;height:auto;background:var(--pareto-background, #09100f);color:var(--pareto-foreground, #eef4ed);font-family:var(--pareto-font-family, &#x27;JetBrains Mono&#x27;, ui-monospace, monospace);overflow:visible" viewBox="0 0 620 290" width="620" xmlns="http://www.w3.org/2000/svg"><style>
